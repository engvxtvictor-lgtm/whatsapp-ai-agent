<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat de Teste — Clínica Lúmina IA</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #eee;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #1a1a1a;
    }
    header {
      padding: 14px 18px;
      background: #111;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: #c5a880;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .header-info h1 { font-size: 15px; font-weight: 600; }
    .header-info p { font-size: 12px; color: #888; }
    .phone-bar {
      padding: 8px 12px;
      background: #111;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .phone-bar label { font-size: 11px; color: #777; white-space: nowrap; }
    .phone-bar input {
      flex: 1;
      background: #222;
      border: 1px solid #333;
      border-radius: 6px;
      color: #ccc;
      font-size: 12px;
      padding: 4px 8px;
      font-family: monospace;
    }
    .btn-clear {
      font-size: 11px;
      padding: 4px 10px;
      background: #2a2a2a;
      border: 1px solid #333;
      border-radius: 6px;
      color: #999;
      cursor: pointer;
    }
    .btn-clear:hover { background: #333; color: #eee; }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #005c4b;
      border-bottom-right-radius: 4px;
    }
    .msg.bot {
      align-self: flex-start;
      background: #2a2a2a;
      border-bottom-left-radius: 4px;
      color: #e8e8e8;
    }
    .msg.loading {
      color: #777;
      font-style: italic;
    }
    .input-area {
      padding: 10px 12px;
      background: #111;
      border-top: 1px solid #2a2a2a;
      display: flex;
      gap: 8px;
    }
    .input-area input {
      flex: 1;
      background: #222;
      border: 1px solid #333;
      border-radius: 22px;
      color: #eee;
      font-size: 14px;
      padding: 10px 16px;
      outline: none;
    }
    .input-area input:focus { border-color: #c5a880; }
    .input-area button {
      background: #c5a880;
      border: none;
      border-radius: 50%;
      width: 42px; height: 42px;
      cursor: pointer;
      font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .input-area button:hover { background: #b8976f; }
    .input-area button:disabled { background: #444; cursor: default; }
    .badge {
      text-align: center;
      font-size: 11px;
      color: #555;
      padding: 4px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="avatar">🦷</div>
      <div class="header-info">
        <h1>Clínica Lúmina IA</h1>
        <p>Ambiente de teste — sem WhatsApp real</p>
      </div>
    </header>

    <div class="phone-bar">
      <label>Número simulado:</label>
      <input type="text" id="phone-input" value="5511900000001">
      <button class="btn-clear" onclick="clearChat()">Limpar sessão</button>
    </div>

    <div class="messages" id="messages">
      <div class="badge">Simule uma conversa de WhatsApp — as respostas vêm da IA real</div>
    </div>

    <div class="input-area">
      <input type="text" id="msg-input" placeholder="Digite uma mensagem..." autocomplete="off">
      <button id="send-btn" onclick="sendMessage()">➤</button>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script>
    const messagesEl = document.getElementById("messages");
    const msgInput = document.getElementById("msg-input");
    const sendBtn = document.getElementById("send-btn");
    let lastHistoryLength = -1;

    msgInput.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    function addMsg(text, role) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    async function loadHistory(forceRedraw = false) {
      const phone = document.getElementById("phone-input").value.trim();
      if (!phone) return;
      try {
        const res = await fetch(`${API_BASE}/test/chat/${phone}/history`);
        if (res.ok) {
          const data = await res.json();
          const messages = data.messages || [];
          if (forceRedraw || messages.length !== lastHistoryLength) {
            messagesEl.innerHTML = `<div class="badge">Simule uma conversa de WhatsApp — as respostas vêm da IA real</div>`;
            messages.forEach(m => {
              const div = document.createElement("div");
              div.className = `msg ${m.role}`;
              div.textContent = m.text;
              messagesEl.appendChild(div);
            });
            messagesEl.scrollTop = messagesEl.scrollHeight;
            lastHistoryLength = messages.length;
          }
        }
      } catch (e) {
        console.error("Erro ao carregar histórico:", e);
      }
    }

    async function sendMessage() {
      const phone = document.getElementById("phone-input").value.trim();
      const text = msgInput.value.trim();
      if (!text) return;

      addMsg(text, "user");
      msgInput.value = "";
      sendBtn.disabled = true;

      const loading = addMsg("digitando...", "bot loading");

      try {
        const res = await fetch(`${API_BASE}/test/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone, message: text })
        });
        const data = await res.json();
        loading.remove();
        
        await loadHistory(true);
      } catch (e) {
        loading.remove();
        addMsg("Erro ao conectar com o backend.", "bot");
      } finally {
        sendBtn.disabled = false;
        msgInput.focus();
      }
    }

    async function clearChat() {
      const phone = document.getElementById("phone-input").value.trim();
      await fetch(`${API_BASE}/test/session/${phone}`, { method: "DELETE" }).catch(() => {});
      messagesEl.innerHTML = `<div class="badge">Sessão limpa — nova conversa iniciada</div>`;
      lastHistoryLength = 0;
    }

    // Monitora mudança no número de telefone para carregar o histórico correspondente
    document.getElementById("phone-input").addEventListener("change", () => {
      loadHistory(true);
    });

    // Inicialização
    loadHistory(true);

    // Polling a cada 2 segundos
    setInterval(() => {
      loadHistory(false);
    }, 2000);
  </script>
</body>
</html>
