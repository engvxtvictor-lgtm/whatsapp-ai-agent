name: clinica-lumina

services:
  # Banco de Dados PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: lumina-db
    restart: always
    environment:
      - POSTGRES_DB=agent_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/system/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis para Sessões do WhatsApp
  redis:
    image: redis:7-alpine
    container_name: lumina-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend FastAPI
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: lumina-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/agent_db
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_URL=https://api.openai.com/v1
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AI_CONFIDENCE_THRESHOLD=${AI_CONFIDENCE_THRESHOLD:-0.70}
      - SESSION_TTL_SECONDS=${SESSION_TTL_SECONDS:-3600}
      - HUMAN_PHONE=${HUMAN_PHONE:-5511999999999}
      - MAX_AI_ATTEMPTS=${MAX_AI_ATTEMPTS:-3}
      - WHATSAPP_API_URL=http://baileys:3000
      - BACKEND_PUBLIC_URL=${BACKEND_PUBLIC_URL:-http://localhost:8000}
      - SERVICES_PDF_FILENAME=${SERVICES_PDF_FILENAME:-lumina_nossos_servicos.pdf}
      # Segurança — OBRIGATÓRIO definir no .env do servidor de produção
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      # CORS — em produção, defina com os domínios reais (ex: ["https://app.lumina.com.br"])
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-["*"]}
      # Modo debug — NUNCA deixar true em produção
      - DEBUG=${DEBUG:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Serviço Baileys WhatsApp Node.js
  baileys:
    build:
      context: ./baileys
      dockerfile: Dockerfile
    container_name: lumina-baileys
    restart: always
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./baileys/auth:/app/auth
    depends_on:
      - backend

  # Front‑End estático (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lumina-frontend
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
